# air hot-reload config  --  go install github.com/air-verse/air@latest
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api.exe ./cmd/edgecache"
  bin = "./tmp/api.exe"
  full_bin = "./tmp/api.exe"
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml"]
  exclude_dir = ["tmp", "bin", "vendor", "testdata", ".git"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"
  log = "build-errors.log"

[env]
  LOG_FORMAT = "text"
  LOG_LEVEL = "debug"

[log]
  time = false
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
