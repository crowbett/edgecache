name: deploy-gcp

# Build the production image, push it to Artifact Registry and roll a new Cloud
# Run revision. Manual only: there is no push/PR trigger, and the job refuses to
# run off main (the Workload Identity provider rejects other refs as well).
#
# Repository variables (no secrets: WIF needs no key), from `terraform output`:
#   GCP_PROJECT_ID    project id
#   GCP_REGION        e.g. us-central1
#   GCP_WIF_PROVIDER  output workload_identity_provider
#   GCP_DEPLOY_SA     output deployer_service_account
#   GCP_AR_REPO       output image_repository  (REGION-docker.pkg.dev/PROJECT/edgecache)
on:
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service name
        required: true
        default: edgecache
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-gcp
  cancel-in-progress: false # never cancel a rollout half way

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # add required reviewers on this environment for a manual gate
    permissions:
      contents: read
      id-token: write # mint the GitHub OIDC token that WIF exchanges
    env:
      IMAGE: ${{ vars.GCP_AR_REPO }}/edgecache
      SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          REPO: ${{ vars.GCP_AR_REPO }}
        run: |
          missing=0
          for v in PROJECT REGION PROVIDER DEPLOY_SA REPO; do
            if [ -z "${!v}" ]; then echo "::error::repository variable for $v is not set"; missing=1; fi
          done
          exit "$missing"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: edgecache
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy by digest so the revision runs exactly the bytes just pushed.
      # Only the image changes; Terraform owns every other setting.
      - name: Deploy to Cloud Run
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGION: ${{ vars.GCP_REGION }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --image "${IMAGE}@${DIGEST}" \
            --quiet

      - name: Report revision
        env:
          REGION: ${{ vars.GCP_REGION }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format 'value(status.latestReadyRevisionName,status.url)' | tee -a "$GITHUB_STEP_SUMMARY"
