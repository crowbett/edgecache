# https://taskfile.dev  --  install: go install github.com/go-task/task/v3/cmd/task@latest
version: "3"

vars:
  APP: edgecache
  MAIN: ./cmd/edgecache
  BIN: bin/{{.APP}}{{exeExt}}
  ORIGIN_BIN: bin/slow-origin{{exeExt}}
  IMAGE: '{{.APP}}:local'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task --list

  tidy:
    desc: go mod tidy + verify
    cmds:
      - go mod tidy
      - go mod verify

  build:
    desc: Build edgecache and slow-origin into bin/ (static, -trimpath, version from git)
    cmds:
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN}} {{.MAIN}}
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.ORIGIN_BIN}} ./cmd/slow-origin
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN}}"
      - "{{.ORIGIN_BIN}}"

  run:
    desc: Run the cache on EDGECACHE_ADDR (127.0.0.1:8081, admin 127.0.0.1:9101) in front of EDGECACHE_ORIGIN (default http://127.0.0.1:8082, see `task origin`)
    env:
      EDGECACHE_ORIGIN: '{{.EDGECACHE_ORIGIN | default "http://127.0.0.1:8082"}}'
      LOG_FORMAT: '{{.LOG_FORMAT | default "text"}}'
    cmds:
      - go run -ldflags="-X main.version={{.VERSION}}" {{.MAIN}}

  origin:
    desc: Run the slow benchmark origin on ORIGIN_ADDR (127.0.0.1:8082; ORIGIN_LATENCY/_JITTER/_BODY_BYTES/_CACHE_CONTROL/_KEYSPACE)
    env:
      ORIGIN_ADDR: '{{.ORIGIN_ADDR | default "127.0.0.1:8082"}}'
    cmds:
      - go run ./cmd/slow-origin

  bench:
    desc: Hot-path microbenchmarks, -count=10 -benchmem, saved to .bench/baseline.txt (scripts/bench.ps1)
    cmds:
      - pwsh -NoProfile -File scripts/bench.ps1 -Save baseline

  bench:compare:
    desc: Run the microbenchmarks and benchstat them against .bench/baseline.txt
    cmds:
      - pwsh -NoProfile -File scripts/bench.ps1 -Compare baseline

  load:
    desc: oha hit-ratio / latency run against slow-origin (cold, warm, no-cache, origin) -> results/<ts>/summary.md
    cmds:
      - pwsh -NoProfile -File scripts/cache.ps1

  pgo:
    desc: Collect cmd/edgecache/default.pgo under warm load and A/B/A/B it -> results/pgo/<ts>/summary.md
    cmds:
      - pwsh -NoProfile -File scripts/pgo.ps1

  dev:
    desc: Hot reload with air (go install github.com/air-verse/air@latest)
    cmds:
      - air

  test:
    desc: Run tests with the race detector (needs a C compiler on Windows)
    cmds:
      - go test -race -count=1 ./...
    env:
      CGO_ENABLED: "1"

  test:fast:
    desc: Run tests without -race
    cmds:
      - go test -count=1 ./...

  cover:
    desc: Coverage report (opens HTML)
    cmds:
      - go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -func=coverage.out
      - go tool cover -html=coverage.out -o coverage.html

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  lint:
    desc: golangci-lint (https://golangci-lint.run/welcome/install/)
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format with gofumpt + goimports
    cmds:
      - golangci-lint fmt ./...

  vuln:
    desc: govulncheck
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  check:
    desc: tidy + vet + lint + test
    deps: [tidy]
    cmds:
      - task: vet
      - task: lint
      - task: test:fast

  docker:build:
    desc: Build the container image
    cmds:
      - docker build -t {{.IMAGE}} --build-arg VERSION={{.VERSION}} .

  docker:run:
    desc: Run the container on :8080
    cmds:
      - docker run --rm -p 8080:8080 -e LOG_FORMAT=text {{.IMAGE}}

  clean:
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "Remove-Item -Recurse -Force bin, tmp, coverage.out, coverage.html -ErrorAction SilentlyContinue"{{else}}rm -rf bin tmp coverage.out coverage.html{{end}}'
