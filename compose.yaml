name: api

# docker compose up -d --build --wait                        # api + postgres + redis (OTel off)
# $env:OTEL_ENABLED="true"; docker compose up -d --build     # api pushes OTLP to the docker-stack collector
#
# Observability backends live in ../docker-stack (`docker compose --profile obs up -d --wait`
# there first). Its collector publishes OTLP on the host at :4317, which this container
# reaches as host.docker.internal (Docker Desktop; `host-gateway` covers Linux engines).
# Override OTEL_EXPORTER_OTLP_ENDPOINT if you put the api on the devstack network instead.

services:
  api:
    build:
      context: .
      args:
        VERSION: local
    image: api:local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      LOG_FORMAT: text
      LOG_LEVEL: debug
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # distroless has no shell -> no HEALTHCHECK here; probe /healthz externally.

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
